<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .glow-orbit {
        animation: rotateOrbit 18s linear infinite;
        transform-origin: 600px 175px;
      }
      .pulse-node {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .float-card {
        animation: floatAnim 4s ease-in-out infinite alternate;
      }
      .wave-bg {
        animation: waveMove 10s ease-in-out infinite alternate;
      }
      @keyframes rotateOrbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.8; transform: scale(1.02); }
      }
      @keyframes floatAnim {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Floating Decorative Graphics in Background -->
  <g opacity="0.25">
    <circle cx="200" cy="80" r="140" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 6" class="glow-orbit"/>
    <circle cx="1000" cy="270" r="180" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" class="glow-orbit"/>
    
    <path d="M-100,280 Q 300,180 600,280 T 1300,200" fill="none" stroke="url(#title-grad)" stroke-width="2" class="wave-bg" />
    <path d="M-100,310 Q 400,220 800,310 T 1300,250" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Relational DB Grid Floating Graphic (Right Side Background Element) -->
  <g transform="translate(880, 50)" opacity="0.35" class="float-card">
    <rect width="240" height="150" rx="12" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1"/>
    <line x1="20" y1="40" x2="220" y2="40" stroke="#818cf8" stroke-width="1"/>
    <line x1="20" y1="75" x2="220" y2="75" stroke="#475569" stroke-width="1"/>
    <line x1="20" y1="110" x2="220" y2="110" stroke="#475569" stroke-width="1"/>
    <circle cx="40" cy="24" r="6" fill="#38bdf8"/>
    <circle cx="60" cy="24" r="6" fill="#818cf8"/>
    <circle cx="80" cy="24" r="6" fill="#c084fc"/>
  </g>

  <!-- Managed Cloud Node Floating Graphic (Left Side Background Element) -->
  <g transform="translate(80, 160)" opacity="0.35" class="float-card" style="animation-delay: -2s;">
    <rect width="200" height="130" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="50" cy="50" r="16" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="150" cy="50" r="16" fill="none" stroke="#a855f7" stroke-width="2"/>
    <circle cx="100" cy="95" r="16" fill="none" stroke="#818cf8" stroke-width="2"/>
    <path d="M64,50 L136,50 M61,60 L89,85 M139,60 L111,85" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Main Content Foreground (High contrast & perfectly legible) -->
  <g text-anchor="middle" transform="translate(600, 0)">
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 55)">
      <rect x="-190" y="0" width="380" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.2"/>
      <text y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">
        🗄️ AWESOME DBaaS ECOSYSTEM ☁️
      </text>
    </g>

    <!-- Main Title -->
    <text y="145" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
      Custom Managed Relational Database Services
    </text>

    <!-- Subtitle -->
    <text y="195" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">
      Commercial DBaaS Platforms • OS-Level Access • Open-Source Operators • HA &amp; BYOL
    </text>

    <!-- Tech Badges Line -->
    <g transform="translate(0, 240)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
      <!-- PostgreSQL -->
      <g transform="translate(-240, 0)">
        <rect x="-65" y="0" width="130" height="30" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
        <text y="20" fill="#93c5fd">🐘 PostgreSQL</text>
      </g>
      <!-- MySQL -->
      <g transform="translate(-100, 0)">
        <rect x="-55" y="0" width="110" height="30" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1"/>
        <text y="20" fill="#7dd3fc">🐬 MySQL</text>
      </g>
      <!-- Oracle -->
      <g transform="translate(30, 0)">
        <rect x="-55" y="0" width="110" height="30" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
        <text y="20" fill="#fca5a5">🔴 Oracle</text>
      </g>
      <!-- SQL Server -->
      <g transform="translate(170, 0)">
        <rect x="-65" y="0" width="130" height="30" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
        <text y="20" fill="#d8b4fe">🔷 SQL Server</text>
      </g>
    </g>

    <!-- Footer Stats / Meta Line -->
    <text y="305" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0.5">
      Curated Cloud Database Ecosystem • Updated October 2026 📅
    </text>
  </g>
</svg>
